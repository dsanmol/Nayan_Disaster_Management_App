databases:
  - name: nayan-data
    plan: free
    databaseName: nayan
    user: nayan
services:
  - type: web
    name: nayan-disaster-management
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nayan-data
          property: connectionString
      - key: NAYAN_JWT_SECRET
        generateValue: true
      - key: NAYAN_DEMO_MODE
        value: "false"
      - key: NAYAN_BOOTSTRAP_ADMIN_EMAIL
        value: admin@nayan.demo
      - key: NAYAN_BOOTSTRAP_ADMIN_PASSWORD
        generateValue: true
      - key: NAYAN_BOOTSTRAP_ADMIN_NAME
        value: Nayan Administrator
